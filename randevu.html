<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevu Al | Furkan Dündar Garage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
</head>
<body class="page-bg">

    <header id="navbar" class="solid-nav">
        <div class="logo">
            <span class="fd">FD</span> FURKAN DÜNDAR <span class="garage">GARAGE</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="hizmetler.html">Hizmetlerimiz</a></li>
                <li><a href="randevu.html" class="active">Randevu Al</a></li>
            </ul>
        </nav>
    </header>

    <section id="appointment-page">
        <div class="appointment-container scroll-anim">
            <div class="appointment-info">
                <h1 class="text-red">ARACINIZ EMİN ELLERDE!</h1>
                <p>Garajımıza gelmeden önce yerinizi ayırtın. JDM uzmanlığı ve profesyonel hizmet için formu doldurun, direkt WhatsApp'tan onaylayalım.</p>
                
                <div class="info-list">
                    <p><i class="fa-solid fa-phone text-red"></i> 0540 771 55 61</p>
                    <p><i class="fa-solid fa-location-dot text-red"></i> SAMSUN, İlkadım</p>
                </div>
            </div>

            <div class="appointment-form">
                <!-- ID eklendi, JS bu formdan verileri alıp WhatsApp'a gönderecek -->
                <form id="whatsapp-form">
                    <div class="form-group">
                        <label>Adınız Soyadınız</label>
                        <input type="text" id="isim" placeholder="Ad Soyad" required>
                    </div>
                    <div class="form-group">
                        <label>Telefon Numaranız</label>
                        <input type="tel" id="telefon" placeholder="05XX XXX XX XX" required>
                    </div>
                    <div class="form-group">
                        <label>Araç Marka / Model</label>
                        <input type="text" id="arac" placeholder="Örn: Honda S2000" required>
                    </div>
                    <div class="form-group">
                        <label>Hizmet Türü</label>
                        <select id="hizmet" required>
                            <option value="" disabled selected>Lütfen Seçiniz</option>
                            <option value="Periyodik Bakım">Periyodik Bakım</option>
                            <option value="Motor Bakımı">Motor Bakımı</option>
                            <option value="Fren Sistemleri">Fren Sistemleri</option>
                            <option value="Arıza Tespiti">Arıza Tespiti</option>
                            <option value="Performans Geliştirme">Performans Geliştirme</option>
                            <option value="Diğer / Genel Kontrol">Diğer / Genel Kontrol</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Eklemek İstedikleriniz (Opsiyonel)</label>
                        <textarea id="notlar" rows="4" placeholder="Şikayetiniz veya belirtmek istedikleriniz..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">WhatsApp Üzerinden Gönder</button>
                </form>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
